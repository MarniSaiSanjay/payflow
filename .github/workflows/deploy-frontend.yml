name: Deploy frontend to Azure Static Web App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all workspaces
        run: npm ci

      - name: Build shared workspace (frontend imports types from here)
        run: npm run build:shared

      - name: Build frontend (REACT_APP_API_URL baked in at build time)
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://payflow-api.azurewebsites.net
          CI: 'false'
        run: npm run build

      - name: Deploy build/ folder to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/build
          skip_app_build: true
          output_location: ''
