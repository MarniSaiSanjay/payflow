name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all workspaces (root)
        run: npm ci

      - name: Build shared workspace
        run: npm run build:shared

      - name: Generate Prisma client (needed for TS types)
        working-directory: backend
        run: npx prisma generate

      - name: Compile backend (TypeScript -> dist/)
        working-directory: backend
        run: npm run build

      # Self-contained deploy bundle. shared is hard-copied into node_modules/
      # to dodge npm-symlink + Oryx-tar.gz issues that strip workspace links.
      - name: Build self-contained deploy bundle
        run: |
          mkdir -p _deploy
          cp -r backend/dist _deploy/dist
          cp -r backend/prisma _deploy/prisma
          cp backend/package.json _deploy/package.json

          # Strip the shared workspace ref so npm install doesn't try to resolve it.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('_deploy/package.json', 'utf8'));
            delete p.dependencies.shared;
            fs.writeFileSync('_deploy/package.json', JSON.stringify(p, null, 2));
          "

          cd _deploy
          npm install --omit=dev --no-audit --no-fund --no-package-lock
          npx prisma generate

          # Hard-copy shared as a real directory (no symlinks).
          mkdir -p node_modules/shared
          cp -r ../shared/dist node_modules/shared/dist
          cp ../shared/package.json node_modules/shared/package.json

          echo "=== Bundle root ==="
          ls -la
          echo "=== node_modules/shared/ ==="
          ls -la node_modules/shared/
          echo "=== Sanity check: node resolves shared ==="
          node -e "console.log(require.resolve('shared'))"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: payflow-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./_deploy
