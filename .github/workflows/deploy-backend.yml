name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all workspaces (root)
        run: npm ci

      - name: Build shared workspace
        run: npm run build:shared

      - name: Compile backend (TypeScript -> dist/)
        working-directory: backend
        run: npm run build

      # The deploy artifact is a flat, self-contained backend bundle.
      # We inline shared/ as a `file:` dep so App Service doesn't need workspace symlinks.
      - name: Build self-contained deploy bundle
        run: |
          mkdir -p _deploy/shared
          cp -r backend/dist _deploy/dist
          cp -r backend/prisma _deploy/prisma
          cp backend/package.json _deploy/package.json
          cp shared/package.json _deploy/shared/package.json
          cp -r shared/dist _deploy/shared/dist

          # Rewrite shared dep: from workspace ("*") to local file path.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('_deploy/package.json', 'utf8'));
            p.dependencies.shared = 'file:./shared';
            fs.writeFileSync('_deploy/package.json', JSON.stringify(p, null, 2));
          "

          # Production-only install inside the deploy bundle (resolves Prisma + shared)
          cd _deploy
          npm install --omit=dev --no-audit --no-fund --no-package-lock

          # Generate Prisma client AFTER install (so it lands in _deploy/node_modules)
          npx prisma generate

          echo "=== Bundle structure ==="
          ls -la
          echo "=== shared resolved as ==="
          ls -la node_modules/shared/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: payflow-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./_deploy
